
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | D'Pimentas</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="acesso.css">
</head>
<body>

    <main class="tela-login">

        <h1>Login</h1>

        <form id="formLogin">

            <label for="nome">Nome</label>
            <input
                type="text"
                id="nome"
                name="nome"
                placeholder="Digite seu nome"
                minlength="2"
                required
            >

            <label for="email">E-mail</label>
            <input
                type="email"
                id="email"
                name="email"
                placeholder="exemplo@gmail.com"
                required
            >

            <label for="senha">Senha</label>
            <input
                type="password"
                id="senha"
                name="senha"
                placeholder="Crie sua senha"
                minlength="8"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,}"
                title="Use pelo menos 8 caracteres, uma letra maiúscula, uma minúscula, um número e um caractere especial."
                required
            >

            <p class="regras-senha">
                A senha deve conter:
                <br>• No mínimo 8 caracteres
                <br>• Uma letra maiúscula e uma minúscula
                <br>• Um número
                <br>• Um caractere especial (@, #, !...)
            </p>

            <button type="submit" class="botao-acessar">
                Acessar
            </button>

            <p id="mensagemErro" class="mensagem-erro" role="alert"></p>

        </form>

    </main>

    <script>
        const formulario = document.getElementById("formLogin");
        const senha = document.getElementById("senha");
        const mensagemErro = document.getElementById("mensagemErro");

        function validarSenha() {
            if (senha.validity.valueMissing) {
                senha.setCustomValidity("Digite sua senha.");
            } else if (senha.validity.tooShort) {
                senha.setCustomValidity(
                    "A senha precisa ter pelo menos 8 caracteres."
                );
            } else if (senha.validity.patternMismatch) {
                senha.setCustomValidity(
                    "Use uma letra maiúscula, uma minúscula, um número e um caractere especial."
                );
            } else {
                senha.setCustomValidity("");
            }
        }

        senha.addEventListener("input", () => {
            validarSenha();
            mensagemErro.textContent = "";
        });

        formulario.addEventListener("submit", function(event) {
            event.preventDefault();

            validarSenha();

            if (!formulario.checkValidity()) {
                formulario.reportValidity();
                return;
            }

            mensagemErro.textContent = "";

            // Abre a página inicial existente.
            const parametros = new URLSearchParams(window.location.search);
            const tipo = parametros.get("tipo");

            if (tipo === "administrativo") {
    window.location.href = "administrativo.html";
} else {
            window.location.href = "index.html";
        };
        });
    </script>

</body>
</html>
